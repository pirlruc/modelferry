[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]

[dependency-groups]
dev = [
  "interrogate>=1.7.0",
  "pip-audit>=2.10.1",
  "pydoclint>=0.9.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "radon>=6.0.1",
]

[project]
name = "model-fetcher"
version = "0.1.0"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]
requires-python = ">=3.13"
authors = [{name = "Nuno Monteiro"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
description = "Download model artifacts from Git registries and resolve versions with feature flags."
keywords = ["feature-flags", "gitlab", "mlops", "model-registry"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
dev = [
  "bandit[toml]==1.9.4",
  "commitizen>=3.0",
  "coverage[toml]>=7.13.5",
  "mypy>=1.20.2",
  "pre-commit==4.6.0",
  "pylint>=3.0",
  "pytest>=8.0",
  "ruff==0.15.12",
]

[project.urls]
Changelog = "https://github.com/pirlruc/modelferry/blob/main/CHANGELOG.md"
Issues = "https://github.com/pirlruc/modelferry/issues"
Repository = "https://github.com/pirlruc/modelferry"

[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "tests"]

# Release flow: local `cz bump` → push tag → GitHub "Release" workflow → optional manual PyPI.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
show_error_codes = true
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pydoclint]
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-class-attributes = false
check-return-types = false
check-yield-types = false
skip-checking-raises = true
style = "google"

[tool.pylint.design]
max-args = 10
max-positional-arguments = 6

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
ignore = [".venv", "build", "dist"]
py-version = "3.13"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
preview = true
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# DOC502 only sees `raise` in the same function. Public methods document errors
# raised by the providers they call, so that finding is not useful here.
ignore = ["DOC502"]
select = [
  "B",
  "C4",
  "D",
  "DOC",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "DOC"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
model_fetcher = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
