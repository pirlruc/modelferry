---
# Generated as the source of truth for epics and tasks.
# Epic issues are the decision records. Do not add docs/adr markdown.
# Methodology: https://github.com/pirlruc/methodologies/tree/1.5.0/github-issue-adr
repo: pirlruc/modelferry
milestones:
  - name: Phase 1 — GitLab fetcher
    status: done
    epics:
      - id: PKG-001
        status: done
        title: Python scaffold and uv packaging
        decision: >-
          In the context of publishing model-fetcher from pirlruc/modelferry, facing
          a request
          to use hatchling plus a private GitHub scaffold that was not readable, we
          decided to
          adopt the public pymjolnir scaffold (setuptools, uv lockfile, ruff, mypy,
          pylint,
          pytest, bandit, gitleaks) on Python 3.13, to achieve the same release path
          as the
          other Python library, accepting that hatchling is not the build backend.
        overview:
          problem: The repository was an empty README and needed a package layout.
          goal: Ship an installable model-fetcher distribution built with uv.
        architecture:
          target: pyproject.toml, src/model_fetcher, .github/workflows
          modules: [model_fetcher]
        acceptance_criteria:
          - uv sync --frozen --extra dev installs the project.
          - uv build produces an sdist and a wheel.
          - CI runs ruff, mypy, pylint, pytest, bandit, gitleaks, uv audit, and uv
            build.
        tasks:
          - id: PKG-001-T1
            status: done
            title: Add the src layout, lockfile, and CI workflows
            instructions:
              files: [pyproject.toml, .github/workflows/ci.yml]
            verification: [uv lock --check, uv build]
      - id: ARCH-001
        status: done
        title: Provider facade for registry download and flag resolution
        decision: >-
          In the context of fetching models from more than one Git host, facing a
          public client
          that must stay stable, we decided that ModelFetcher depends only on
          BaseRegistryProvider and BaseFlagProvider and that GitLab is the first registered
          provider, to achieve a later GitHub provider without facade changes, accepting
          that
          GitHub is not implemented in this milestone.
        overview:
          problem: A GitLab-only client would have to be rewritten for GitHub.
          goal: Two operations — download a file, and resolve a flag to coordinates.
        architecture:
          target: src/model_fetcher/client.py, src/model_fetcher/base.py
          modules: [model_fetcher]
        acceptance_criteria:
          - download_model, get_feature_flag, and download_from_feature_flag are the
            public operations.
          - register_provider adds a platform without editing those methods.
          - The package does not import an ML framework or FastAPI.
        out_of_scope:
          - FastAPI application. The library is a client. Pydantic models the payloads.
            FastAPI would be a third responsibility.
          - Loading or executing model bytes.
        tasks:
          - id: ARCH-001-T1
            status: done
            title: Implement ModelFetcher and the provider contracts
            instructions:
              files:
                - src/model_fetcher/client.py
                - src/model_fetcher/base.py
                - src/model_fetcher/models.py
            verification: [uv run pytest tests/test_client.py]
      - id: CACHE-001
        status: done
        title: Atomic cache and SHA-256 verification
        decision: >-
          In the context of interrupted downloads, facing partial files being treated
          as models,
          we decided to stream into <file>.downloading and rename only after size
          and SHA-256
          checks, under <cache>/<provider>/<project>/<model>/<version>/<file>, to
          achieve safe
          reuse, accepting a non-unique temp name when two processes write the same
          artifact.
        overview:
          problem: A killed download must not look like a finished artifact.
          goal: Return a cached path when the file and digest are already valid.
        architecture:
          target: src/model_fetcher/cache.py
          modules: [model_fetcher]
        acceptance_criteria:
          - Cache hits do not download the file again.
          - force_download fetches again.
          - A digest mismatch deletes the partial file.
        tasks:
          - id: CACHE-001-T1
            status: done
            title: Implement CacheManager
            instructions:
              files: [src/model_fetcher/cache.py, tests/test_cache.py]
            verification: [uv run pytest tests/test_cache.py]
      - id: GLREG-001
        status: done
        title: GitLab model registry and generic package download
        decision: >-
          In the context of GitLab model artifacts, facing two storage APIs, we decided
          to
          resolve GET /projects/:id/ml/models/:name/versions/:version (or list by
          name) and
          download GET /projects/:id/packages/ml_models/:version_id/files/:file, falling
          back
          to the generic package route when the model version is missing and a file
          name was
          given, to achieve both registries behind one method, accepting an extra
          404 round
          trip in the fallback path.
        overview:
          problem: Callers need one download call for model-registry and generic packages.
          goal: Stream the file with PRIVATE-TOKEN or JOB-TOKEN and return a Path.
        architecture:
          target: src/model_fetcher/providers/gitlab/registry.py
          modules: [model_fetcher]
        acceptance_criteria:
          - 401 and 403 raise AuthenticationError.
          - 404 raises ModelNotFoundError.
          - A checksum mismatch raises DownloadError and writes no final file.
        tasks:
          - id: GLREG-001-T1
            status: done
            title: Implement GitLabRegistryProvider
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/registry.py
                - tests/test_gitlab_registry.py
            verification: [uv run pytest tests/test_gitlab_registry.py]
      - id: GLFLG-001
        status: done
        title: GitLab feature-flag coordinate resolution
        decision: >-
          In the context of choosing a model version at runtime, facing Unleash client
          credentials and the REST feature-flag API, we decided to prefer the Unleash
          features
          endpoint when an instance id is configured and otherwise read the REST flag,
          parsing
          model_name and version from the variant payload, strategy parameters, or
          description,
          to achieve dynamic coordinates, accepting that gradual rollout percentages
          are not
          fully simulated.
        overview:
          problem: The model version should come from a flag payload, not only from
            the caller.
          goal: download_from_feature_flag fetches the coordinates the flag names.
        architecture:
          target: src/model_fetcher/providers/gitlab/flags.py
          modules: [model_fetcher]
        acceptance_criteria:
          - A variant JSON payload downloads that model version.
          - A disabled or missing flag does not download.
          - user_id and environment context can reject a strategy.
        tasks:
          - id: GLFLG-001-T1
            status: done
            title: Implement GitLabFlagProvider
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/flags.py
                - tests/test_gitlab_flags.py
                - tests/test_client.py
            verification:
              - uv run pytest tests/test_gitlab_flags.py tests/test_client.py
      - id: GRD-001
        status: done
        title: Pin guardrails 1.6.0 and meet the Python complexity floors
        decision: >-
          In the context of checking model-fetcher against pirlruc/guardrails 1.6.0,
          facing PY-CPLX-001 max cyclomatic complexity 8 while several parsers were
          above that floor, we decided to split those functions and pin
          docs/guardrails at tag 1.6.0 plus .github/scaffold at tag 1.5.0, to achieve
          the org Python profile without lowering a gate, accepting that CI must
          fetch the private submodules with GUARDRAILS_READ_TOKEN.
        overview:
          problem: The first commit approximated guardrails from a public scaffold.
          goal: Measure and enforce the 1.6.0 Python complexity, coverage, and doc
            floors.
        architecture:
          target: src/model_fetcher, scripts/check-python-complexity.py, .github/workflows
          modules: [model_fetcher]
        acceptance_criteria:
          - docs/guardrails gitlink is tag 1.6.0.
          - Radon max cyclomatic complexity is at most 8 and the average is at most
            5.
          - Statement and branch coverage are at least 95 percent.
        tasks:
          - id: GRD-001-T1
            status: done
            title: Split hot functions and wire the threshold checks
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/flag_eval.py
                - scripts/check-python-complexity.py
                - scripts/check-python-coverage.py
            verification:
              - uv run python scripts/check-python-complexity.py
              - uv run python scripts/check-python-coverage.py
  - name: Phase 2 — Operate and harden
    status: open
    epics:
      - id: OPS-001
        status: open
        title: Let CI fetch the private guardrails and scaffold
        decision: >-
          In the context of quality, test, and docs workflows failing closed,
          facing private gitlinks for guardrails 1.6.0 and scaffold 1.5.0, we
          decided to store a contents-read token as the Actions secret
          GUARDRAILS_READ_TOKEN instead of vendoring those repos, to achieve
          green CI on main, accepting that a human has to create the secret.
        overview:
          problem: scripts/checkout-private-submodules.sh exits when the secret is empty.
          goal: The quality, tests, and docs workflows check out the pinned gitlinks.
        architecture:
          target: .github/workflows, scripts/checkout-private-submodules.sh
          modules: [model_fetcher]
        acceptance_criteria:
          - GUARDRAILS_READ_TOKEN can read pirlruc/guardrails and pirlruc/github-scaffold.
          - A push to main completes the quality, tests, and docs workflows.
        out_of_scope:
          - Copying the private repositories into this repo.
        tasks:
          - id: OPS-001-T1
            status: open
            title: Add the Actions secret and rerun main CI
            instructions:
              files:
                - .github/workflows/ci-quality.yml
                - .github/workflows/ci-tests.yml
                - .github/workflows/ci-docs.yml
                - scripts/checkout-private-submodules.sh
            verification:
              - The quality, tests, and docs runs on main finish green.
      - id: REL-001
        status: open
        title: Configure PyPI Trusted Publishing
        decision: >-
          In the context of the first release of model-fetcher, facing a
          publish workflow that runs when a GitHub Release is published, we
          decided to use PyPI Trusted Publishing for the model-fetcher project
          instead of a long-lived token, to achieve publish-pypi.yml without a
          stored password, accepting that the first tag waits on that trust
          relationship.
        overview:
          problem: publish-pypi.yml will fail until PyPI trusts this repository.
          goal: An annotated v*.*.* tag can publish the built distributions.
        architecture:
          target: .github/workflows/publish-pypi.yml
          modules: [model_fetcher]
        acceptance_criteria:
          - PyPI lists this repo and the publish workflow as a trusted publisher.
          - A published GitHub Release uploads the sdist and wheel.
        tasks:
          - id: REL-001-T1
            status: open
            title: Register the trusted publisher and confirm the workflow
            instructions:
              files:
                - .github/workflows/publish-pypi.yml
                - .github/workflows/release.yml
            verification:
              - The publish workflow's trusted-publishing environment matches PyPI.
      - id: REL-002
        status: open
        title: Let Dependabot read the private submodules
        decision: >-
          In the context of monthly submodule updates, facing private
          guardrails and scaffold gitlinks, we decided to add a Dependabot git
          registry only after DEPENDABOT_GITHUB_TOKEN exists, to achieve
          automated gitlink bumps, accepting that the registry stays absent
          until that secret is created.
        overview:
          problem: gitsubmodule updates cannot clone the private pins.
          goal: Dependabot can open pull requests that move the gitlinks.
        architecture:
          target: .github/dependabot.yml
          modules: [model_fetcher]
        acceptance_criteria:
          - DEPENDABOT_GITHUB_TOKEN can read both private repositories.
          - The Dependabot git registry is configured and a dry update run can
            fetch the gitlinks.
        tasks:
          - id: REL-002-T1
            status: open
            title: Add the Dependabot git credential and registry
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - dependabot.yml registers the git registry for github.com.
      - id: GH-001
        status: open
        title: Download release assets from GitHub
        decision: >-
          In the context of a second model host, facing a facade that must stay
          stable, we decided to add a GitHub Releases provider through
          register_provider without changing ModelFetcher, to achieve the same
          download and flag methods for GitHub, accepting a separate flag
          source because GitHub has no Unleash API.
        overview:
          problem: Callers cannot fetch a release asset without a new client.
          goal: ModelFetcher(provider="github") returns a verified Path.
        architecture:
          target: src/model_fetcher/providers, src/model_fetcher/client.py
          modules: [model_fetcher]
        acceptance_criteria:
          - register_provider("github", ...) is shipped, not only documented.
          - download_model returns a cached Path for one release asset.
          - The public ModelFetcher method signatures stay the same.
        out_of_scope:
          - Loading or executing model bytes.
        tasks:
          - id: GH-001-T1
            status: open
            title: Implement the GitHub registry and flag providers
            instructions:
              files:
                - src/model_fetcher/client.py
                - src/model_fetcher/providers
            verification:
              - uv run pytest tests/test_client.py
      - id: CACHE-002
        status: done
        title: Make cache writes exclusive and bounded
        decision: >-
          In the context of two processes fetching the same artifact, facing
          the CACHE-001 acceptance of one shared <file>.downloading name, we
          decided to give each writer its own temporary file and an exclusive
          lock, and to add an optional maximum size, to achieve uncorrupted
          artifacts and a disk bound, accepting an extra lock file beside the
          artifact. Cache hits may trust a matching sidecar instead of hashing
          the whole file again.
        overview:
          problem: A shared temp name can mix two writers, and every cache hit
            re-reads multi-gigabyte files. A hostile body can fill the disk.
          goal: One published file matches its digest, and reuse does not always
            rehash it.
        architecture:
          target: src/model_fetcher/cache.py
          modules: [model_fetcher]
        acceptance_criteria:
          - Two overlapping writes of the same destination cannot publish mixed
            bytes.
          - A caller-supplied maximum size rejects a larger stream and leaves
            no final file.
          - A cache hit with a matching sidecar does not rehash the file.
          - A sidecar older than the file is hashed instead of trusted.
        tasks:
          - id: CACHE-002-T1
            status: done
            title: Use a unique temp file and an exclusive lock
            instructions:
              files:
                - src/model_fetcher/cache.py
                - tests/test_cache.py
            verification:
              - uv run pytest tests/test_cache.py
          - id: CACHE-002-T2
            status: done
            title: Reject streams above an optional maximum size
            instructions:
              files:
                - src/model_fetcher/cache.py
                - src/model_fetcher/config.py
                - tests/test_cache.py
            verification:
              - uv run pytest tests/test_cache.py
          - id: CACHE-002-T3
            status: done
            title: Trust a matching sidecar on cache hits
            instructions:
              files:
                - src/model_fetcher/cache.py
                - tests/test_cache.py
            verification:
              - uv run pytest tests/test_cache.py
      - id: GLREG-002
        status: done
        title: Retry GitLab failures and stop listing early
        decision: >-
          In the context of flaky registry calls and large model lists, facing
          a single attempt and a full page walk before a name match, we decided
          to retry transient 5xx and transport errors with a short bounded
          backoff and to stop paging once the named model is found, to achieve
          fewer false failures and less traffic, accepting no retry of 4xx.
          A 401 or 403 from a cross-origin redirect target is a DownloadError,
          not an AuthenticationError.
        overview:
          problem: One GitLab 5xx fails the download, and name lookup can walk
            20 pages. Object storage often answers 403 with the GitLab token
            already stripped.
          goal: Transient failures are retried, and a storage 403 is reported as
            a download failure.
        architecture:
          target: src/model_fetcher/providers/gitlab/http.py, src/model_fetcher/providers/gitlab/registry.py
          modules: [model_fetcher]
        acceptance_criteria:
          - A single 503 followed by 200 still returns the artifact.
          - 401 and 403 from the GitLab origin stay AuthenticationError.
          - 403 from another host raises DownloadError.
          - Model name search stops on the page that contains the name.
        tasks:
          - id: GLREG-002-T1
            status: done
            title: Retry transient GitLab responses
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/http.py
                - tests/test_gitlab_registry.py
            verification:
              - uv run pytest tests/test_gitlab_registry.py
          - id: GLREG-002-T2
            status: done
            title: Classify cross-origin auth failures as download errors
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/http.py
                - tests/test_gitlab_registry.py
            verification:
              - uv run pytest tests/test_gitlab_registry.py
          - id: GLREG-002-T3
            status: done
            title: Stop the model list once the name matches
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/registry.py
                - tests/test_gitlab_registry.py
            verification:
              - uv run pytest tests/test_gitlab_registry.py
      - id: GLFLG-002
        status: done
        title: Honor gradual rollout percentages
        decision: >-
          In the context of a flag that enables a model for a percentage of
          users, facing the GLFLG-001 acceptance that rollout percentages are
          not simulated, we decided to evaluate gradualRolloutUserId from the
          user id with the same stickiness bucket GitLab uses, to achieve an
          enabled bit that matches the flag for that user, accepting that
          uncommon strategy types can still fall through as non-matching.
        overview:
          problem: A rollout strategy currently counts as enabled for every user
            once the environment scope matches.
          goal: download_from_feature_flag follows the percentage for user_id.
        architecture:
          target: src/model_fetcher/providers/gitlab/flag_eval.py
          modules: [model_fetcher]
        acceptance_criteria:
          - The same user_id stays inside or outside a percentage across calls.
          - A 0 percent rollout does not resolve a model.
          - A 100 percent rollout resolves the payload.
        tasks:
          - id: GLFLG-002-T1
            status: done
            title: Evaluate gradualRolloutUserId
            instructions:
              files:
                - src/model_fetcher/providers/gitlab/flag_eval.py
                - tests/test_gitlab_flags.py
            verification:
              - uv run pytest tests/test_gitlab_flags.py
      - id: NODE-001
        status: open
        title: Drop the Node 24 force flag when actions no longer need it
        decision: >-
          In the context of FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 on every
          workflow, facing actions that may already run on Node 24, we decided
          to remove the force flag only after each pinned action declares Node
          24, to achieve workflows without a global override, accepting that
          the flag stays until that audit is done.
        overview:
          problem: The force flag hides which actions are not Node 24-ready.
          goal: Workflows run on the action's own Node version.
        architecture:
          target: .github/workflows
          modules: [model_fetcher]
        acceptance_criteria:
          - No workflow sets FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
          - The pinned actions, including gitleaks-action, still complete.
        tasks:
          - id: NODE-001-T1
            status: open
            title: Remove the force flag after the action audit
            instructions:
              files:
                - .github/workflows
            verification:
              - The quality and security workflows complete without the force flag.

