---
name: Docs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned guardrails and scaffold
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: sh scripts/checkout-private-submodules.sh
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Sync project and dev dependencies
        run: uv sync --frozen --extra dev
      - name: Doc coverage and docstring style
        run: |
          doc_coverage="$(uv run python -c 'import yaml; from pathlib import Path; data = yaml.safe_load(Path("docs/guardrails/python/profile.thresholds.yml").read_text()); print(data["doc_coverage"])')"
          uv run interrogate --fail-under "${doc_coverage}" src/model_fetcher
          uv run pydoclint src/model_fetcher
      - name: Relative markdown links
        run: uv run python .github/scaffold/scripts/lint-doc-links.py --root "$PWD"
