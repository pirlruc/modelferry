name: Release

on:
  push:
    # GitHub tag filters are globs. This matches a bare X.Y.Z tag.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/pydevops/.github/workflows/python-release.yml@297fb0f3d7a70e26f9717eb3273933b8d5123b8a
    with:
      python_version: "3.13"
      working_directory: .
