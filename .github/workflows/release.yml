name: Release

on:
  push:
    # GitHub tag filters are globs. This matches a bare X.Y.Z tag.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/pydevops/.github/workflows/python-release.yml@1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
    with:
      python_version: "3.13"
      working_directory: .
