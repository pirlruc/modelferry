---
name: Python quality
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
# The reusable workflow sets its own job permissions.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-quality:
    # pydevops 2.1.1, peeled commit 19fa370 (CI-018). Call the workflow.
    # Do not check pirlruc/pydevops out from this repository.
    # PYDEVOPS_READ_TOKEN is not passed: workflow_call only accepts
    # caller_pat, and that secret posts the PR comment. The DevOps
    # checkout inside the reusable workflow uses github.token.
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@19fa370f5f11bae423d4c0586080dbed32f9ddf8
    with:
      strictness_level: High
      docstring_format: Google
      enable_dast: false
      license_deny_list: '[]'
      working_directory: .
      python_version: '3.13'
