name: python-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  python-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Union of the job permissions in pydevops python-quality 3.10.1.
    permissions:
      contents: read
      actions: write
      packages: read
      pull-requests: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
    with:
      strictness_level: Medium
      docstring_format: Google
      enable_dast: false
      installable_app: false
      working_directory: .
      python_version: "3.13"
      devops_repository: pirlruc/pydevops
      devops_ref: 1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
      app_install_command: uv sync --frozen --extra dev
    secrets:
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
