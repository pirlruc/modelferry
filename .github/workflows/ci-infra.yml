---
name: Infra
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infra:
    # This repository is public, so `uses:` cannot resolve a private reusable
    # workflow. The job checks out commondevops 5.1.2 at the same SHA the
    # reusable callers pin (CI-018 / CI-034) with COMMONDEVOPS_READ_TOKEN.
    # CI-024: Dependabot cannot read that secret.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout commondevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
          token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
          persist-credentials: false
          path: _commondevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Install tooling
        env:
          INSTALL_ONLY: actionlint,hadolint,shellcheck
        run: bash _commondevops/scripts/install-common-tools.sh

      - name: Install zizmor
        run: |
          set -euo pipefail
          pipx install 'zizmor==1.29.0' || pip install --user 'zizmor==1.29.0'
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: actionlint
        id: actionlint
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows \( -name '*.yml' -o -name '*.yaml' \))
          if [[ ${#workflows[@]} -eq 0 ]]; then
            echo "No workflows to lint"
            exit 0
          fi
          if (( ${#workflows[@]} > 40 )); then
            echo "CI-035: ${#workflows[@]} workflow files exceeds actionlint cap of 40" >&2
            exit 1
          fi
          actionlint "${workflows[@]}"

      - name: shellcheck
        id: shellcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -name '*.sh')
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts"
            exit 0
          fi
          shellcheck "${scripts[@]}"

      - name: hadolint
        id: hadolint
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find docker -name 'Dockerfile*' 2>/dev/null || true)
          if [[ ${#dockerfiles[@]} -eq 0 ]]; then
            echo "No Dockerfiles"
            exit 0
          fi
          hadolint "${dockerfiles[@]}"

      - name: zizmor
        id: zizmor
        continue-on-error: true
        run: |
          set -euo pipefail
          config=()
          if [[ -f .github/config/zizmor.yml ]]; then
            config=(-c .github/config/zizmor.yml)
          fi
          zizmor --min-severity=low "${config[@]}" .github/workflows

      - name: Gate — lint
        if: always()
        env:
          ADVISORY: "false"
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          HADOLINT: ${{ steps.hadolint.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
        run: |
          set -euo pipefail
          bash _commondevops/scripts/gate-aggregate.sh \
            actionlint="${ACTIONLINT}" \
            shellcheck="${SHELLCHECK}" \
            hadolint="${HADOLINT}" \
            zizmor="${ZIZMOR}"
