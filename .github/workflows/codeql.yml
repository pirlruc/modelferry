name: codeql

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-codeql.yml@1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
    secrets:
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
