# commondevops reusable workflows. Pin is the peeled commit of annotated tag v6.4.0.
name: shared-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shared-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      run_shfmt: true
      shell_scripts: scripts/*.sh
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  doc-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      run_link_lint: true
      run_markdownlint: true
      run_shfmt: true
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79

  scaffold-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    secrets:
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  secrets-sast:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      semgrep_config: p/python
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      pin_script: scripts/check-submodule-pins.sh
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79

  token-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    secrets:
      # Dependabot runs cannot read Actions secrets. The Dependabot secret
      # covers the same private pins and is what the expiry audit can see.
      guardrails_token: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && secrets.DEPENDABOT_GITHUB_TOKEN || secrets.GUARDRAILS_READ_TOKEN }}

  scorecard:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      blocking: true
      publish_results: true

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79

  threshold-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    with:
      drift_script: scripts/check-threshold-drift.sh
      scripts_ref: f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
    secrets:
      checkout_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  sweep:
    permissions:
      actions: write
    uses: pirlruc/commondevops/.github/workflows/artifact-sweep.yml@f7658926d6236a6af3fb44b2bc5bbfd2578c1b79
