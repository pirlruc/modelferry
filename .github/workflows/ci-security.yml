---
name: Security
# PY-SEC-002/003/004 stay here as the token-free Dependabot job.
# python-quality is called from ci-python.yml. It has no checkout_token
# input, so PYDEVOPS_READ_TOKEN is not passed. common-secrets-sast would
# repeat gitleaks and semgrep behind COMMONDEVOPS_READ_TOKEN.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    # CI-024: no Actions secret. This is the token-free job Dependabot can run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Sync project and dev dependencies
        run: uv sync --frozen --extra dev
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src -q
      - name: Semgrep
        run: uv run --with semgrep==1.159.0 semgrep --config p/python --error --quiet src
      - name: pip-audit
        run: uv run pip-audit
      - name: Gitleaks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
