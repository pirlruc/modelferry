---
name: Quality
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned guardrails and scaffold
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: sh scripts/checkout-private-submodules.sh
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Sync project and dev dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests examples scripts && uv run ruff format --check src tests examples scripts
      - name: Mypy
        run: uv run mypy -p model_fetcher -p tests
      - name: Pylint
        run: uv run pylint src tests
      - name: Complexity
        run: uv run python scripts/check-python-complexity.py
      - name: ShellCheck
        run: shellcheck scripts/*.sh
