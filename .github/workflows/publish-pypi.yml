---
name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: vars.PYPI_PUBLISH == 'true'
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          kind="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          test "${kind}" = "tag"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Release builds must not restore a shared cache (zizmor cache-poisoning).
          enable-cache: false
      - name: Sync dev toolchain
        run: uv sync --frozen --extra dev
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
