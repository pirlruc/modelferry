# SC-DEP-001/002/003. Cadence from docs/guardrails/supply-chain/profile.thresholds.yml.
# Private submodule fetches need a Dependabot git registry and DEPENDABOT_GITHUB_TOKEN.
# Leave that registry commented until the secret exists; an empty secret fails closed.
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
