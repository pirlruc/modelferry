# SC-DEP-001/002/003. Cadence from docs/guardrails/supply-chain/profile.thresholds.yml.
# Private submodule fetches use Dependabot secret DEPENDABOT_GITHUB_TOKEN (SC-DEP-005).
version: 2
registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  # Ungrouped so a non-tag tip does not block the grouped pull request (SC-DEP-004).
  - package-ecosystem: gitsubmodule
    directory: /
    registries:
      - github-private
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
