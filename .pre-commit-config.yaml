---
# exclude: ^(examples|tools|doc)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^(.devcontainer/devcontainer.json|.vscode/launch.json)$
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-added-large-files
      - id: debug-statements
      - id: name-tests-test
        # Default --pytest expects *suffix*_test.py; pytest discovery is usually test_*.py.
        # tests/support.py is a fixture helper, not a test module.
        args: [--pytest-test-first]
        exclude: ^tests/support\.py$
      - id: requirements-txt-fixer
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        # Dependabot requires schedule.time to remain quoted strings; yamlfix removes those quotes.
        exclude: ^\.github/dependabot\.yml$
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.4
    hooks:
      - id: toml-sort-fix
        args:
          - --in-place
          - --sort-table-keys
          - --sort-inline-tables
          - --sort-first=name,version,dependencies,requires-python,authors,maintainers
          - --trailing-comma-inline-array
          - --sort-inline-arrays
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # Issue and PR templates keep YAML front matter. mdformat turns the leading
        # --- into a thematic break and GitHub then ignores the template.
        exclude: ^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$)
        args: [--wrap=100, --number]
        additional_dependencies: [mdformat-gfm]
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.1
    hooks:
      - id: typos
  - repo: https://github.com/jsh9/format-json
    rev: 0.1.2
    hooks:
      - id: format-json
        args: [--autofix, --no-ensure-ascii, --indent=4, --no-sort-keys]
        exclude: ^(.devcontainer/devcontainer.json|.vscode/launch.json)$
  - repo: https://github.com/jsh9/blank-line-after-blocks
    rev: 0.1.4
    hooks:
      - id: blank-line-after-blocks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies:
          - httpx==0.28.1
          - pydantic==2.13.5
          - pytest==9.1.1
        args: [--config-file=pyproject.toml, -p, model_fetcher, -p, tests]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/HunterMcGushion/docstr_coverage
    rev: v2.3.2
    hooks:
      - id: docstr-coverage
        args: [--accept-empty]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        stages: [pre-push]
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.159.0
    hooks:
      - id: semgrep-ci
        # Pinned ruleset (reproducible, lighter than `auto`). Swap for `auto` or a custom `semgrep.yml` if you prefer.
        args: [--config, p/python, --quiet]
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]
